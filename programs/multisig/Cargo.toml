# The lez_multisig guest for LEZ v0.3 (RFP-005 prototype).
#
# Written against lee_core directly: SPEL has no v0.3 support. Every LEZ crate
# is pinned to the v0.3.0 tag, commit db66590ab. The logic lives in `core`, so
# the CLI and the host tests run the very plan/apply functions the guest runs.
[workspace]
members = [".", "core"]
resolver = "2"

[package]
name    = "lez-multisig-guest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "lez_multisig"
path = "src/bin/lez_multisig.rs"

[dependencies]
lez-multisig-core = { path = "core" }
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
