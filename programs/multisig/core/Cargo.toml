[package]
name    = "lez-multisig-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Instructions, effects, state, digests and the plan/apply logic of lez_multisig on LEZ v0.3."

[dependencies]
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh      = { version = "1.5", features = ["derive"] }
k256       = { version = "0.13.3", default-features = false, features = ["schnorr", "arithmetic"] }

[dev-dependencies]
k256       = { version = "0.13.3", default-features = false, features = ["schnorr", "arithmetic", "std"] }
